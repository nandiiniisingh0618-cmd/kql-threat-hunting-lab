# Tooling configuration. This project is not packaged or published -- it is a lab.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "attack-stix", "export"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (includes E402: import not at top of file)
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ARG",  # unused arguments
    "RUF",  # ruff-specific
]
ignore = [
    # Long lines are tolerated in prose: these tools emit large amounts of
    # documentation text, and breaking it hurts readability more than it helps.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# sys.path is extended before the local imports so the tools package resolves when
# these files are run directly rather than as installed modules.
"tasks.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
