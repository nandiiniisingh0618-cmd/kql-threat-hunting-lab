id: 71adeef5-36d6-57a4-a7ba-7c253d5375fa
name: Obfuscated or encoded PowerShell execution
description: >-
  PowerShell was invoked with a combination of encoding, download-and-execute, stealth-flag and indirect-execution patterns that together indicate intent to hide from command-line inspection. Scored across four independent marker categories and across three telemetry sources, then aggregated per host, account and marker set so one campaign produces one alert rather than thousands.
severity: Medium
status: validated
attack_version: 20.1
techniques:
  - T1059.001
data_sources:
  - PowerShell EventID 4104 (script block)
  - PowerShell EventID 800 (classic pipeline)
  - Sysmon EventID 1 (ProcessCreate)
max_cross_dataset_rate: 0.95
query: |
  // T1059.001 - PowerShell
  let lookback = 3650d;
  let min_score = 2;      // 2 independent marker categories; raise to 3 for a quieter rule
  // Each marker category is weak on its own. The score is what makes this usable.
  let encoding_markers  = dynamic(["-enc", "-encodedcommand", "frombase64string", "-e "]);
  let download_markers  = dynamic(["downloadstring", "downloadfile", "invoke-webrequest",
                                   "net.webclient", "start-bitstransfer", "invoke-restmethod"]);
  let stealth_markers   = dynamic(["-w hidden", "-windowstyle hidden", "-nop", "-noprofile",
                                   "-noni", "-noninteractive", "-ep bypass", "-executionpolicy bypass"]);
  let indirect_markers  = dynamic(["iex", "invoke-expression", "&([scriptblock]", "icm "]);
  let candidates =
      union isfuzzy=false
        ( PowerShellScriptBlock()
          | project TimeGenerated, Computer, Account, Text = ScriptBlockText,
                    DatasetId, Telemetry = "PowerShell4104" ),
        ( PowerShellClassic()
          | project TimeGenerated, Computer, Account = UserId,
                    Text = strcat(HostApplication, " ", CommandLineText),
                    DatasetId, Telemetry = "PowerShell800" ),
        ( SysmonProcessCreate()
          | where Process has "powershell" or Process =~ "pwsh.exe"
          | project TimeGenerated, Computer, Account, Text = CommandLine,
                    DatasetId, Telemetry = "Sysmon1" );
  candidates
  | where TimeGenerated > ago(lookback)
  | where isnotempty(Text)
  | extend TextLower = tolower(Text)
  // Cheap gate first: a row with none of these cannot reach the score, so stop early.
  // ScriptBlockText can be very large, so this ordering matters for cost.
  | where TextLower has_any ("enc", "base64", "download", "iex", "invoke-expression",
                             "hidden", "-nop", "bypass", "webclient", "icm ")
  | extend HasEncoding = TextLower has_any (encoding_markers),
           HasDownload = TextLower has_any (download_markers),
           HasStealth  = TextLower has_any (stealth_markers),
           HasIndirect = TextLower has_any (indirect_markers)
  | extend Score = toint(HasEncoding) + toint(HasDownload) + toint(HasStealth) + toint(HasIndirect)
  | where Score >= min_score
  | extend Markers = strcat(iff(HasEncoding, "encoding ", ""), iff(HasDownload, "download ", ""),
                            iff(HasStealth, "stealth ", ""), iff(HasIndirect, "indirect ", ""))
  // Collapse a campaign into one row per host/account/marker-set. Without this the rule
  // returns tens of thousands of near-identical rows and is unusable for triage.
  | summarize
      Events            = count(),
      FirstSeen         = min(TimeGenerated),
      LastSeen          = max(TimeGenerated),
      Telemetries       = make_set(Telemetry, 3),
      SampleCommandLine = take_any(substring(Text, 0, 300))
      by Computer, Account, Score, Markers, DatasetId
  | project TimeGenerated = FirstSeen, Computer, Account, Score, Markers, Events,
            Telemetries, SampleCommandLine, LastSeen, DatasetId
  | order by Score desc, Events desc
entity_mappings:
  - entity_type: Host
    identifier: Computer
  - entity_type: Account
    identifier: Account
false_positives:
  - Deployment and configuration tooling (SCCM, Intune, Chocolatey, CI agents) routinely combines -nop -ep bypass with a download and will score 2.
  - Administrator one-liners that fetch and run an internal script score 2 legitimately.
  - Base64 is used benignly to pass structured arguments to PowerShell.
  - EventID 4104 logs the script block AFTER de-obfuscation, so decoded content may merely mention these strings without being malicious.
  - "This rule fires on 23 of 39 datasets in this corpus. That is NOT noise: the Empire PowerShell launcher (-nop -w hidden -enc) is present in most OTRF datasets, so those are genuine true positives. max_cross_dataset_rate is raised to 0.95 for that reason, and the ceiling would be meaningless on production telemetry."
tuning_notes: >-
  min_score >= 2 is the pivot: single markers are far too common to alert on, two independent categories is strongly anomalous. Score 4 clusters in this corpus are all Empire launchers. The aggregation is as important as the scoring - pre-aggregation this rule produced 10,519 rows, post-aggregation 100. Keep the has_any gate ahead of the marker evaluation as a cost control. In production, baseline per parent process: a scored script block under a CI agent is routine, the same under winword.exe is not.
known_blind_spots:
  - A payload with no encoding, no download and no stealth flags - a plain local script - scores 0 and is invisible.
  - String concatenation and format-operator obfuscation defeats the literal markers in the Sysmon and 800 arms.
  - PowerShell v2 downgrade (-version 2) suppresses script-block logging entirely.
  - Unmanaged PowerShell (hosting System.Management.Automation directly) creates no powershell.exe process.
  - Script-block logging is off by default below Windows 10 / Server 2016.
  - Aggregation hides per-event timing, so a slow drip and a burst look alike apart from FirstSeen/LastSeen.
references:
  - https://attack.mitre.org/techniques/T1059/001/
tests:
  - dataset_id: SDWIN-190518182022
    min_hits: 1
    expect:
        Markers: encoding
  - dataset_id: SDWIN-200721232741
    min_hits: 1
