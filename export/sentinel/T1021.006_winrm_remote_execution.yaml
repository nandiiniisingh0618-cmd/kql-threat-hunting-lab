id: 79d365f9-29e7-54df-9f3b-78a4ea74812f
name: "WinRM remote execution - process spawned by WinRM host"
description: |
    A process was created with wsmprovhost.exe (the WinRM/PowerShell Remoting host) as its parent, or a WinRM network connection preceded local execution. PowerShell Remoting is a legitimate management channel and therefore a favoured lateral-movement path that blends into administrative traffic.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - LateralMovement
relevantTechniques:
  - T1021
subTechniques:
  - T1021.006
query: |
    // T1021.006 - Windows Remote Management
    let lookback = 3650d;
    let winrm_ports = dynamic([5985, 5986]);
    // Arm 1: anything hosted by the WinRM provider host is remote execution by definition.
    let winrm_children =
        SysmonProcessCreate()
        | where TimeGenerated > ago(lookback)
        | where ParentProcess =~ "wsmprovhost.exe" or Process =~ "wsmprovhost.exe"
        | project TimeGenerated, Computer, Account, ParentProcess, Process, NewProcessName,
                  CommandLine, DatasetId, Evidence = "wsmprovhost process";
    // Arm 2: outbound WinRM connections identify the SOURCE host of the movement.
    let winrm_connections =
        SysmonNetwork()
        | where TimeGenerated > ago(lookback)
        | where DestinationPort in (winrm_ports)
        | where Initiated =~ "true" or isempty(Initiated)
        | project TimeGenerated, Computer, Account, ParentProcess = "", Process,
                  NewProcessName = ProcessName,
                  CommandLine = strcat("-> ", DestinationIp, ":", tostring(DestinationPort)),
                  DatasetId, Evidence = "outbound WinRM connection";
    union isfuzzy=false (winrm_children), (winrm_connections)
    | summarize
        Events       = count(),
        Processes    = make_set(Process, 8),
        Samples      = make_set(substring(CommandLine, 0, 140), 5),
        FirstSeen    = min(TimeGenerated),
        LastSeen     = max(TimeGenerated)
        by Computer, Account, Evidence, DatasetId
    | project TimeGenerated = FirstSeen, Computer, Account, Evidence, Events,
              Processes, Samples, LastSeen, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Lateral Movement"
  sourceRule: "detections/lateral_movement/T1021.006_winrm_remote_execution.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "PowerShell Remoting is a standard administration tool; in estates that use it, this rule describes normal operations and must be baselined per source host and account."
  - "Configuration management (DSC, Ansible for Windows, Puppet) drives WinRM constantly."
  - "Monitoring and patching agents connect to 5985 routinely."
  - "Exchange and other Microsoft products use WinRM internally between roles."
knownBlindSpots:
  - "WinRM over a non-default port is missed by the network arm, though the wsmprovhost arm still fires on the target."
  - "WinRM used only to read information (Get-* cmdlets inside the remote session) spawns no child process and so produces no arm-1 hit."
  - "Session-internal activity in PowerShell Remoting is only visible via script-block logging, not process creation."
  - "If Sysmon network events are disabled, source attribution is lost entirely."
  - "Does not distinguish an authorised admin from an attacker using stolen admin credentials - that requires identity context this rule has no access to."
