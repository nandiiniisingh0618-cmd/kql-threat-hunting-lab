id: f9da2203-0d36-5d4d-8691-ac35a44e60cb
name: "LOLBin proxy execution - mshta, regsvr32, rundll32 or similar"
description: |
    A signed Microsoft binary was used to execute code supplied from elsewhere: mshta running script, regsvr32 loading a scriptlet, rundll32 invoking an exported function, or similar. The binary is trusted and allowlisted, so attackers use it as a proxy to run their own code without dropping an unsigned executable.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Stealth
  # if rejected on upload, use: DefenseEvasion (pre-v19 name)
relevantTechniques:
  - T1218
subTechniques:
  - T1218.003
  - T1218.004
  - T1218.005
  - T1218.010
  - T1218.011
query: |
    // T1218.x - System Binary Proxy Execution
    let lookback = 3650d;
    // Argument shapes that indicate the LOLBin is being driven, not doing its day job.
    let script_markers  = dynamic(["javascript:", "vbscript:", "about:", "scrobj.dll",
                                   "script:", "mshtml", "runhtmlapplication"]);
    let remote_markers  = dynamic(["http://", "https://", @"\\", "ftp://"]);
    let user_paths      = dynamic([@"\users\", @"\appdata\", @"\temp\", @"\programdata\",
                                   @"\windows\temp\", @"\public\"]);
    let lolbins = dynamic(["mshta.exe", "regsvr32.exe", "rundll32.exe", "cmstp.exe",
                           "installutil.exe", "msbuild.exe", "msxsl.exe", "wmic.exe",
                           "certutil.exe", "regasm.exe", "regsvcs.exe"]);
    let process_events =
        union isfuzzy=false
          ( SysmonProcessCreate()
            | project TimeGenerated, Computer, Account, Process, NewProcessName, CommandLine,
                      ParentProcess, ParentProcessName, DatasetId, Telemetry = "Sysmon1" ),
          ( SecurityProcessCreate()
            | project TimeGenerated, Computer, Account, Process, NewProcessName, CommandLine,
                      ParentProcess, ParentProcessName = ParentProcessName,
                      DatasetId, Telemetry = "Security4688" );
    process_events
    | where TimeGenerated > ago(lookback)
    | where Process in~ (lolbins)
    | where isnotempty(CommandLine)
    | extend CommandLineLower = tolower(CommandLine)
    | extend HasScriptMarker = CommandLineLower has_any (script_markers),
             HasRemoteSource = CommandLineLower has_any (remote_markers),
             FromUserPath    = CommandLineLower has_any (user_paths)
    | where HasScriptMarker or HasRemoteSource or FromUserPath
    | extend Indicators = strcat(iff(HasScriptMarker, "script-handler ", ""),
                                 iff(HasRemoteSource, "remote-source ", ""),
                                 iff(FromUserPath, "user-path ", "")),
             Technique = case(
                 Process =~ "mshta.exe",       "T1218.005 Mshta",
                 Process =~ "regsvr32.exe",    "T1218.010 Regsvr32",
                 Process =~ "rundll32.exe",    "T1218.011 Rundll32",
                 Process =~ "cmstp.exe",       "T1218.003 CMSTP",
                 Process =~ "installutil.exe", "T1218.004 InstallUtil",
                 strcat("T1218 ", Process))
    | project TimeGenerated, Computer, Account, ParentProcess, Process,
              Technique, Indicators, CommandLine, Telemetry, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: NewProcessName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Stealth"
  sourceRule: "detections/stealth/T1218_lolbin_proxy_execution.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
  exported: 2026-11-15T16:50:36Z
falsePositives:
  - "rundll32.exe is invoked constantly by Windows and by installers with DLLs under user paths; the user-path indicator alone is weak for it."
  - "Legitimate software updaters fetch content over HTTP via these binaries."
  - "msbuild.exe and installutil.exe are normal on developer workstations."
  - "certutil.exe is used legitimately for certificate management, sometimes with URLs."
  - "Control-panel applets and shell extensions produce rundll32 command lines with user paths."
knownBlindSpots:
  - "A LOLBin executing content from a non-user, non-remote path with no script marker (for example a DLL planted in system32) matches nothing here."
  - "The LOLBin list is finite; the LOLBAS project tracks over a hundred binaries and this covers eleven."
  - "Renaming the LOLBin defeats the process-name match entirely - detecting that needs OriginalFileName, which Sysmon provides and this rule does not yet use."
  - "COM-based execution of the same payloads produces no LOLBin process."
  - "Command-line auditing must be enabled for the 4688 arm."
