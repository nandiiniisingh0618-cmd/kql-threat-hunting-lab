id: c93fcbd6-44ac-503b-aaf2-5afea5fa1f0a
name: "Remote thread created in another process"
description: |
    A process created a thread inside a different process. This is the classic CreateRemoteThread injection primitive used to run code in a trusted process's address space, for credential access, defence evasion or privilege escalation.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - PrivilegeEscalation
  - Stealth
  # if rejected on upload, use: DefenseEvasion (pre-v19 name)
relevantTechniques:
  - T1055
subTechniques:
  - T1055.002
query: |
    // T1055 - Process Injection (incl. T1055.002 Portable Executable Injection)
    let lookback = 3650d;
    // Known-benign injectors on a healthy host. csrss and wininit create threads in new
    // processes as part of normal process startup.
    let benign_injector_pairs = dynamic(["csrss.exe", "wininit.exe", "services.exe",
                                         "svchost.exe", "msmpeng.exe", "mssense.exe"]);
    // A StartModule of NULL/empty means the thread entry point is in unbacked memory,
    // which is a strong signal of shellcode rather than a legitimate module call.
    SysmonRemoteThread()
    | where TimeGenerated > ago(lookback)
    | where SourceProcess !~ TargetProcess            // self-threads are not injection
    | where SourceProcess !in~ (benign_injector_pairs)
    | extend UnbackedEntryPoint = isempty(StartModule) or StartModule =~ "null",
             TargetIsLsass      = TargetProcess =~ "lsass.exe"
    | summarize
        Threads        = count(),
        StartModules   = make_set(StartModule, 5),
        StartFunctions = make_set(StartFunction, 5),
        FirstSeen      = min(TimeGenerated),
        LastSeen       = max(TimeGenerated),
        AnyUnbacked    = max(UnbackedEntryPoint)
        by Computer, Account, SourceProcessName, SourceProcess, TargetProcessName,
           TargetProcess, TargetIsLsass, DatasetId
    | project TimeGenerated = FirstSeen, Computer, Account,
              SourceProcessName, SourceProcess, TargetProcessName, TargetProcess,
              Threads, AnyUnbacked, TargetIsLsass, StartModules, StartFunctions,
              LastSeen, DatasetId
    | order by Threads desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: SourceProcessName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Privilege Escalation, Stealth"
  sourceRule: "detections/privilege_escalation/T1055_remote_thread_injection.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
  exported: 2026-11-15T16:50:36Z
falsePositives:
  - "EDR and AV products inject monitoring threads into user processes by design and must be allowlisted."
  - "Application compatibility shims, accessibility tools and some debuggers legitimately create remote threads."
  - "Software protection and licensing wrappers (DRM) use injection."
  - "Browser sandboxing and some installers create threads cross-process during startup."
  - "The allowlist is image-name based, so renaming a payload to csrss.exe evades it."
knownBlindSpots:
  - "The stealthier injection families produce no EventID 8 at all: APC queuing, thread hijacking (SetThreadContext on an existing thread), process hollowing and Early Bird all avoid CreateRemoteThread."
  - "Mapping-based injection (NtMapViewOfSection) plus an existing thread is invisible here."
  - "Sysmon EventID 8 is often disabled or heavily filtered in production because of volume."
  - "Only the creation is seen, not what the thread did - correlate with the target process's subsequent behaviour."
  - "Injection within the same process (self-injection, reflective loading) is not cross-process and is intentionally excluded."
