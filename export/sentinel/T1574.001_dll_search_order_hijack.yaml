id: 58af2ee9-de6b-5fbd-99f0-6bf78b403b4c
name: "Unsigned or user-path DLL loaded by a service or system binary"
description: |
    A module was loaded from a user-writable directory, or loaded unsigned into a process running from system32. DLL search-order and phantom-DLL hijacking exploit the loader's path resolution to get attacker code into a trusted, often auto-starting, process.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
  - Stealth
  # if rejected on upload, use: DefenseEvasion (pre-v19 name)
relevantTechniques:
  - T1574
subTechniques:
  - T1574.001
query: |
    // T1574.001 - DLL
    let lookback = 3650d;
    let user_writable_paths = dynamic([@"\users\", @"\appdata\", @"\temp\", @"\programdata\",
                                       @"\public\", @"\windows\temp\", @"\downloads\"]);
    // Processes whose DLL loads are worth scrutinising: service hosts and system binaries.
    let sensitive_hosts = dynamic(["svchost.exe", "services.exe", "lsass.exe", "spoolsv.exe",
                                   "winlogon.exe", "explorer.exe", "dllhost.exe",
                                   "taskhostw.exe", "searchindexer.exe", "wmiprvse.exe"]);
    SysmonImageLoad()
    | where TimeGenerated > ago(lookback)
    | extend ModulePathLower  = tolower(ImageLoaded),
             ProcessPathLower = tolower(ProcessName)
    // Cheap gate: only DLLs, and only the two interesting shapes.
    | where ModulePathLower endswith ".dll"
    | extend FromUserWritablePath = ModulePathLower has_any (user_writable_paths),
             IsUnsigned = Signed =~ "false" or SignatureStatus !~ "Valid"
    | where FromUserWritablePath or (IsUnsigned and ProcessPathLower startswith @"c:\windows\system32\")
    | extend HostIsSensitive = Process in~ (sensitive_hosts)
    | extend Indicators = strcat(iff(FromUserWritablePath, "user-writable-path ", ""),
                                 iff(IsUnsigned, "unsigned ", ""),
                                 iff(HostIsSensitive, "sensitive-host ", ""))
    | summarize
        Loads      = count(),
        Modules    = make_set(ModuleName, 8),
        FirstSeen  = min(TimeGenerated),
        LastSeen   = max(TimeGenerated)
        by Computer, Account, ProcessName, Process, Indicators,
           HostIsSensitive, Signed, SignatureStatus, DatasetId
    | project TimeGenerated = FirstSeen, Computer, Account, ProcessName, Process,
              Modules, Loads, Indicators, HostIsSensitive, Signed, SignatureStatus,
              LastSeen, DatasetId
    | order by HostIsSensitive desc, Loads desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Execution, Stealth"
  sourceRule: "detections/stealth/T1574.001_dll_search_order_hijack.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "Enormously noisy without tuning: legitimate applications installed under %LOCALAPPDATA% (Teams, Slack, VS Code, Chrome) load their own unsigned DLLs constantly."
  - "Developer machines load freshly built, unsigned DLLs all day."
  - "Installers and updaters stage DLLs in Temp and load them from there."
  - "Signature status can read as invalid simply because the host could not reach a CRL/OCSP endpoint, not because the file is untrusted."
  - "This is the lowest-precision rule in this repo; it is included because DLL hijacking is important, and it is explicitly a hunting rule rather than an alerting rule."
knownBlindSpots:
  - "A signed-but-malicious DLL (stolen or abused certificate) in a legitimate path matches nothing here."
  - "Hijacking that replaces a DLL in system32 (requires admin) is neither in a user path nor unsigned-in-system32 if properly signed."
  - "Phantom DLL hijacking of a module that never loads successfully may not raise EventID 7 at all."
  - "Sysmon EventID 7 is frequently disabled in production because of its volume, which is the single biggest limitation."
  - "Reflectively loaded DLLs never touch the loader and produce no image-load event."
  - "SignatureStatus depends on the host's ability to validate the chain, so results vary with network conditions."
