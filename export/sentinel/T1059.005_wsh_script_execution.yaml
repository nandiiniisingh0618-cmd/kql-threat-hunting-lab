id: da5e94b3-e716-5aca-a077-1924604c30fc
name: "Windows Script Host execution of a script from a user-writable path"
description: |
    cscript.exe or wscript.exe executed a VBScript, JScript or WSF file, or was launched by a document or mail application. Windows Script Host is a legacy execution channel that remains enabled by default and is a common first-stage loader.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
relevantTechniques:
  - T1059
subTechniques:
  - T1059.005
query: |
    // T1059.005 - Visual Basic (Windows Script Host)
    let lookback = 3650d;
    let script_extensions = dynamic([".vbs", ".vbe", ".js", ".jse", ".wsf", ".wsh", ".hta"]);
    let user_writable_paths = dynamic([@"\users\", @"\appdata\", @"\temp\", @"\programdata\",
                                       @"\public\", @"\downloads\", @"\windows\temp\"]);
    // Parents that should never be launching a script interpreter.
    let document_parents = dynamic(["winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe",
                                    "acrord32.exe", "msaccess.exe", "visio.exe",
                                    "7zfm.exe", "winrar.exe", "explorer.exe"]);
    let process_events =
        union isfuzzy=false
          ( SysmonProcessCreate()
            | project TimeGenerated, Computer, Account, Process, NewProcessName, CommandLine,
                      ParentProcess, DatasetId, Telemetry = "Sysmon1" ),
          ( SecurityProcessCreate()
            | project TimeGenerated, Computer, Account, Process, NewProcessName, CommandLine,
                      ParentProcess, DatasetId, Telemetry = "Security4688" );
    process_events
    | where TimeGenerated > ago(lookback)
    | where Process in~ ("cscript.exe", "wscript.exe")
    | extend CommandLineLower = tolower(CommandLine)
    | extend HasScriptFile     = CommandLineLower has_any (script_extensions),
             FromUserPath      = CommandLineLower has_any (user_writable_paths),
             SuspiciousParent  = ParentProcess in~ (document_parents)
    | where HasScriptFile or FromUserPath or SuspiciousParent
    | extend Indicators = strcat(iff(HasScriptFile, "script-file ", ""),
                                 iff(FromUserPath, "user-path ", ""),
                                 iff(SuspiciousParent, "document-parent ", ""))
    | project TimeGenerated, Computer, Account, ParentProcess, Process,
              CommandLine, Indicators, Telemetry, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: NewProcessName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Execution"
  sourceRule: "detections/execution/T1059.005_wsh_script_execution.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
  exported: 2026-11-15T16:50:36Z
falsePositives:
  - "Legacy enterprise applications and logon scripts still ship VBScript, often from network or ProgramData paths."
  - "Some installers and management agents use WSH for setup tasks."
  - "Printer, driver and OEM utilities occasionally call cscript."
  - "The explorer.exe parent is included as a 'document parent' because a user double-clicking a script is worth seeing, but on some estates that is routine and should be removed."
knownBlindSpots:
  - "Script content executed from stdin or via a COM host (not a file argument) has no extension to match."
  - "A script run from a path not in the user-writable list, by an ordinary parent, with no recognised extension, matches nothing."
  - "Renaming cscript.exe defeats the process-name gate; OriginalFileName would be more robust."
  - "WSH invoked through a scheduled task shows the task as the parent rather than the real originator."
  - "Command-line auditing must be enabled for the 4688 arm."
