id: cc55e1c9-e0d9-58d9-8f71-865ecd02eea9
name: "WMI permanent event subscription created"
description: |
    A WMI event filter, consumer or filter-to-consumer binding was created. Together these three objects form a permanent event subscription that runs code when a trigger condition is met, surviving reboots and living entirely in the WMI repository rather than on disk or in the registry's usual autorun locations.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1546
subTechniques:
  - T1546.003
query: |
    // T1546.003 - Windows Management Instrumentation Event Subscription
    let lookback = 3650d;
    // Consumer classes that can execute code. A filter alone is inert; a binding to one of
    // these is what makes a subscription dangerous.
    let executing_consumers = dynamic(["CommandLineEventConsumer", "ActiveScriptEventConsumer",
                                       "ScriptingStandardConsumerSetting"]);
    SysmonWmiEvent()
    | where TimeGenerated > ago(lookback)
    | where WmiOperation =~ "Created"
    | extend ConsumerIsExecuting = WmiConsumer has_any (executing_consumers)
                                    or WmiType has_any (executing_consumers)
    | project TimeGenerated, Computer, Account, Activity, WmiOperation,
              WmiName, WmiQuery, WmiConsumer, WmiFilter, WmiDestination, WmiType,
              ConsumerIsExecuting, EventID, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Persistence, Privilege Escalation"
  sourceRule: "detections/persistence/T1546.003_wmi_event_subscription.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "Monitoring and systems-management products (SCCM, SCOM, antivirus) legitimately register permanent event subscriptions."
  - "Some OEM and power-management software uses WMI eventing for hardware triggers."
  - "Dell, HP and Lenovo management agents are common benign sources in enterprise estates."
  - "Because legitimate subscriptions are created once at install time, a baseline of expected consumer names is very effective here."
knownBlindSpots:
  - "Sysmon's WMI events cover permanent subscriptions only; temporary (session-scoped) subscriptions are not logged and die with the process anyway."
  - "Subscriptions created before Sysmon was installed are invisible - enumerate existing ones with a hunt query instead of relying on this rule."
  - "Only 3 such events exist in this entire 420k-event corpus, so this rule is validated on a single dataset; that is a thin evidence base."
  - "A subscription created in a non-default WMI namespace may not be captured depending on Sysmon configuration."
  - "The execution itself happens via scrcons.exe, which is better caught as a process-creation anomaly."
