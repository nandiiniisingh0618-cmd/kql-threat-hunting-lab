id: d0eef444-bfac-51e4-ad73-779e9541aa13
name: "LSASS process handle opened with credential-dump access mask"
description: |
    A process other than a known-good caller opened a handle to lsass.exe with a right combination that permits reading process memory (PROCESS_VM_READ plus PROCESS_QUERY_INFORMATION). This is the common final step for Mimikatz-style credential theft regardless of the tool used to deliver it.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003
subTechniques:
  - T1003.001
query: |
    // T1003.001 - LSASS Memory
    // Cheap filters first: the function already pins channel+EventID, then we narrow on
    // the target image before touching the access mask or call trace.
    let lookback = 3650d;                       // lab data is historical; see tuning_notes
    // Masks that include PROCESS_VM_READ (0x0010) + PROCESS_QUERY_INFORMATION (0x0400).
    let dump_access_masks = dynamic([
        "0x1010",     // VM_READ | QUERY_INFORMATION           - Mimikatz sekurlsa
        "0x1410",     // + QUERY_LIMITED_INFORMATION
        "0x1438",     // comsvcs.dll MiniDump / procdump style
        "0x143a",
        "0x1f0fff",   // PROCESS_ALL_ACCESS
        "0x1fffff"
    ]);
    // Processes that legitimately open LSASS on a healthy Windows host.
    let benign_source_processes = dynamic([
        "wmiprvse.exe", "msmpeng.exe", "mssense.exe", "sensendr.exe",
        "svchost.exe", "csrss.exe", "wininit.exe", "services.exe", "lsass.exe"
    ]);
    SysmonProcessAccess()
    | where TimeGenerated > ago(lookback)
    | where TargetProcess =~ "lsass.exe"
    | where GrantedAccess in~ (dump_access_masks)
    | where SourceProcess !in~ (benign_source_processes)
    | summarize
        Hits          = count(),
        AccessMasks   = make_set(GrantedAccess, 8),
        FirstSeen     = min(TimeGenerated),
        LastSeen      = max(TimeGenerated),
        CallTraceSample = take_any(CallTrace)
        by Computer, SourceProcessName, SourceProcess, SourceAccount, DatasetId
    | extend UnbackedCallTrace = CallTraceSample has "UNKNOWN"
    | project TimeGenerated = FirstSeen, Computer, Account = SourceAccount,
              SourceProcessName, SourceProcess, AccessMasks, Hits,
              UnbackedCallTrace, LastSeen, DatasetId
    | order by Hits desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: SourceProcessName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Credential Access"
  sourceRule: "detections/credential_access/T1003.001_lsass_handle_access.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
  exported: 2026-11-15T16:50:36Z
falsePositives:
  - "EDR and AV agents (MsMpEng.exe, MsSense.exe) read LSASS routinely; allowlisted above by image name."
  - "Backup, DLP and performance-monitoring agents may open LSASS with 0x1410."
  - "Crash-dump tooling (WerFault.exe) opens LSASS legitimately after a fault."
  - "Allowlisting by image NAME only is weak: an attacker who renames their binary to msmpeng.exe evades it. In production, allowlist by signer plus path."
knownBlindSpots:
  - "Handle-duplication: an attacker who duplicates an existing LSASS handle produces no new EventID 10."
  - "Kernel-mode or driver-based reads (BYOVD) do not surface as ProcessAccess."
  - "Masks outside the allowlist are missed by design; a tool requesting only 0x0010 slips through."
  - "If Sysmon excludes lsass.exe from ProcessAccess logging (a common performance tweak) there is no telemetry at all."
  - "Does not detect dumping via MiniDumpWriteDump invoked from an already-privileged signed process."
