id: 3a7cb31e-26d7-5847-aa48-276aedab3eac
name: "Process spawned by WMI provider host"
description: |
    A process was created with WmiPrvSE.exe as its parent, or wmic.exe was used to invoke process creation. WMI is a legitimate management channel, which is exactly why attackers use it for local and remote execution: the payload inherits a trusted parent.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
relevantTechniques:
  - T1047
query: |
    // T1047 - Windows Management Instrumentation
    let lookback = 3650d;
    // WmiPrvSE legitimately spawns these as part of normal inventory and management.
    let expected_wmi_children = dynamic([
        "wmiprvse.exe", "wmiadap.exe", "wermgr.exe", "werfault.exe",
        "taskhostw.exe", "conhost.exe", "msiexec.exe", "tiworker.exe"
    ]);
    let interpreter_children = dynamic([
        "cmd.exe", "powershell.exe", "pwsh.exe", "cscript.exe", "wscript.exe",
        "mshta.exe", "rundll32.exe", "regsvr32.exe", "msbuild.exe", "installutil.exe"
    ]);
    SysmonProcessCreate()
    | where TimeGenerated > ago(lookback)
    | where ParentProcess =~ "wmiprvse.exe"
          or (Process =~ "wmic.exe" and tolower(CommandLine) has "process"
              and tolower(CommandLine) has_any ("call", "create"))
    | where Process !in~ (expected_wmi_children)
    | extend ExecutionVia = iff(Process =~ "wmic.exe", "wmic process call", "WmiPrvSE child"),
             ChildIsInterpreter = Process in~ (interpreter_children)
    | project TimeGenerated, Computer, Account, ParentProcess, Process, NewProcessName,
              CommandLine, ExecutionVia, ChildIsInterpreter, IntegrityLevel, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: NewProcessName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Execution"
  sourceRule: "detections/execution/T1047_wmi_process_execution.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
  exported: 2026-11-15T16:50:36Z
falsePositives:
  - "Monitoring, inventory and software-deployment agents drive WMI heavily; their children must be allowlisted."
  - "SCCM/Intune remote actions and Group Policy scripts legitimately execute via WMI."
  - "Some installers legitimately appear beneath WmiPrvSE.exe, which is why msiexec and TiWorker are excluded."
  - "The allowlist is image-name based and therefore evadable by renaming."
knownBlindSpots:
  - "WMI event-subscription persistence executes via scrcons.exe, not WmiPrvSE - that is the separate T1546.003 rule."
  - "WMI used only to query information (no process creation) is not execution and is intentionally not covered here."
  - "Remote WMI shows the child on the TARGET host, so without that host's telemetry the execution is unseen."
  - "An attacker whose payload is named conhost.exe or wermgr.exe is allowlisted away."
