id: 3e380fcb-abae-53a1-a294-b04bc21e6591
name: "SAM or SYSTEM registry hive exported to disk"
description: |
    A command line saved or exported the SAM, SECURITY or SYSTEM registry hive root to a file. Offline, those hives together yield local account password hashes, so exporting the hive root is a reliable credential-access signal. Exports of individual subkeys underneath a hive are normal administration and are excluded.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003
subTechniques:
  - T1003.002
query: |
    // T1003.002 - Security Account Manager
    let lookback = 3650d;
    let hive_dump_verbs = dynamic(["save", "export", "copy"]);
    // Matches a hive ROOT only: "hklm\sam" followed by whitespace, a quote or end of
    // string. This deliberately excludes "hklm\system\currentcontrolset\..." which
    // ordinary provisioning and support scripts export all the time.
    let hive_root_pattern = @'hklm\\(sam|security|system)(\s|"|$)';
    let process_events =
        union isfuzzy=false
          ( SysmonProcessCreate()
            | project TimeGenerated, Computer, Account, Process, NewProcessName,
                      CommandLine, ParentProcess, DatasetId, Telemetry = "Sysmon1" ),
          ( SecurityProcessCreate()
            | project TimeGenerated, Computer, Account, Process, NewProcessName,
                      CommandLine, ParentProcess, DatasetId, Telemetry = "Security4688" );
    process_events
    | where TimeGenerated > ago(lookback)
    | where isnotempty(CommandLine)
    | extend CommandLineLower = tolower(CommandLine)
    // Cheap substring prefilter before the regex, which is the expensive part.
    | where CommandLineLower has_any ("hklm", "esentutl")
    | where (CommandLineLower matches regex hive_root_pattern
                and CommandLineLower has_any (hive_dump_verbs))
          or (Process =~ "esentutl.exe" and CommandLineLower has_any ("sam", "security", "system"))
    // Computer accounts performing SYSTEM-hive maintenance are an OS behaviour, not theft.
    | where Account !endswith "$"
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcess,
              Telemetry, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: Process
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Credential Access"
  sourceRule: "detections/credential_access/T1003.002_sam_hive_extraction.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "Backup, imaging and migration tooling exports the SYSTEM hive legitimately."
  - "Support engineers export hives for diagnostics; SAM/SECURITY export is far rarer than SYSTEM."
  - "VERIFIED IN THIS CORPUS: dataset SDWIN-190319023812 contains WORKSTATION5$ (a computer account) running 'reg export HKLM\\SYSTEM\\CurrentControlSet\\...'. That is benign OS activity and is the reason this rule matches only hive roots and drops accounts ending in '$'."
  - "A single hive export without the other two is less conclusive; hash cracking needs SAM plus SYSTEM."
knownBlindSpots:
  - "In-memory hive reads through registry APIs create no child process and no command line."
  - "Volume-shadow-copy access to the hive files bypasses reg.exe entirely (covered by the T1003.003 rule)."
  - "Command-line auditing must be on for the 4688 arm; without it only Sysmon works."
  - "An attacker who exports to a subkey path repeatedly could stitch a hive together and evade the root-only match."
  - "Renaming esentutl.exe defeats the process-name arm, though the command-line arm still fires."
