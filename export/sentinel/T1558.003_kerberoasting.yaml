id: eb0be1c3-dcef-5eb6-a814-a6ac342282a3
name: "Kerberoasting - RC4 service tickets requested for multiple SPNs"
description: |
    A single source requested Kerberos service tickets (TGS) encrypted with RC4-HMAC for one or more user-account SPNs. RC4 tickets are offline-crackable, and modern domains default to AES, so a deliberate RC4 request - especially a burst across several distinct services - is the signature of Kerberoasting.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1558
subTechniques:
  - T1558.003
query: |
    // T1558.003 - Kerberoasting
    let lookback = 3650d;
    let burst_window = 10m;                 // SPN sweep is fast; widen for slow-and-low
    let min_distinct_spns = 1;              // raise to 3+ in production to cut noise
    let rc4_encryption_types = dynamic(["0x17", "0x18"]);   // RC4-HMAC, RC4-HMAC-EXP
    SecurityKerberos()
    | where TimeGenerated > ago(lookback)
    | where EventID == 4769
    | where TicketEncryptionType in~ (rc4_encryption_types)
    // Machine-account and krbtgt SPNs are routine; user-account SPNs are the roastable ones.
    | where ServiceName !endswith "$" and ServiceName !~ "krbtgt"
    | where Status =~ "0x0" or isempty(Status)      // only successfully issued tickets
    | summarize
        TicketsRequested = count(),
        DistinctSpns     = dcount(ServiceName),
        Spns             = make_set(ServiceName, 12),
        FirstSeen        = min(TimeGenerated),
        LastSeen         = max(TimeGenerated)
        by Computer, TargetUserName, IpAddress, DatasetId, TimeBucket = bin(TimeGenerated, burst_window)
    | where DistinctSpns >= min_distinct_spns
    | extend BurstSeconds = datetime_diff('second', LastSeen, FirstSeen)
    | project TimeGenerated = FirstSeen, Computer, Account = TargetUserName, IpAddress,
              DistinctSpns, TicketsRequested, Spns, BurstSeconds, DatasetId
    | order by DistinctSpns desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IpAddress
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Credential Access"
  sourceRule: "detections/credential_access/T1558.003_kerberoasting.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "Legacy applications and appliances that only support RC4 request these tickets normally; allowlist those SPNs."
  - "Domain functional levels or account flags (msDS-SupportedEncryptionTypes) can force RC4 for genuine services."
  - "Vulnerability scanners and AD hygiene tools deliberately enumerate SPNs and will trip this."
  - "A single RC4 ticket for one SPN is weak evidence; the burst across distinct SPNs is the real signal."
knownBlindSpots:
  - "An attacker who requests AES tickets instead (where the SPN supports it) is invisible to this rule - the tradeoff is they are much harder to crack."
  - "Slow-and-low roasting, one SPN per hour, defeats the burst window."
  - "Requires 'Audit Kerberos Service Ticket Operations' on domain controllers."
  - "Targeted roasting of a single known high-value SPN produces DistinctSpns = 1 and is indistinguishable here from a legacy app."
