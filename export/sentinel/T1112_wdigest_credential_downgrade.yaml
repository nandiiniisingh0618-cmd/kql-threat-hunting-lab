id: bae612da-bf24-541c-8504-64672c56ce98
name: "Credential-protection registry downgrade (WDigest, LSA PPL or NTLM)"
description: |
    The WDigest UseLogonCredential registry value was set to 1, which makes LSASS cache plaintext passwords in memory again. Attackers set this and then wait for users to log on, so that a later LSASS dump yields passwords rather than only hashes.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseImpairment
  # if rejected on upload, use: DefenseEvasion (pre-v19 name)
  - Persistence
relevantTechniques:
  - T1112
query: |
    // T1112 - Modify Registry (credential-caching downgrade)
    let lookback = 3650d;
    // Registry values that weaken credential protection in LSASS.
    let credential_downgrade_values = dynamic([
        @"\SecurityProviders\WDigest\UseLogonCredential",
        @"\Lsa\DisableRestrictedAdmin",
        @"\Lsa\RunAsPPL",
        @"\Lsa\LsaCfgFlags",
        @"\Lsa\TokenLeakDetectDelaySecs",
        @"\Lsa\LMCompatibilityLevel",
        @"\MSV1_0\NtlmMinClientSec",
        @"\MSV1_0\RestrictSendingNTLMTraffic"
    ]);
    SysmonRegistry()
    | where TimeGenerated > ago(lookback)
    | where RegistryEventType !~ "DeleteValue"
    // Cheap gate before the has_any.
    | where RegistryKey has_any ("WDigest", "Lsa")
    | where RegistryKey has_any (credential_downgrade_values)
    | extend ValueNumeric = toint(extract(@"(\d+)\s*\)?$", 1, RegistryValueData))
    | extend Control = tostring(split(RegistryKey, @"\")[-1])
    // Direction matters: UseLogonCredential=1 weakens, RunAsPPL=0 weakens.
    | extend WeakensSecurity = case(
          Control =~ "UseLogonCredential",   ValueNumeric == 1,
          Control =~ "RunAsPPL",             ValueNumeric == 0,
          Control =~ "DisableRestrictedAdmin", ValueNumeric == 1,
          // Downgrading LM/NTLM negotiation enables NetNTLM capture (Internal Monologue).
          Control =~ "LMCompatibilityLevel",   ValueNumeric <= 2,
          Control =~ "RestrictSendingNTLMTraffic", ValueNumeric == 0,
          Control startswith "Ntlm",           true,
          true)
    | where WeakensSecurity
    | project TimeGenerated, Computer, Account, Process, ProcessName,
              Control, RegistryKey, RegistryValueData, ValueNumeric,
              RegistryEventType, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessName
  - entityType: RegistryKey
    fieldMappings:
      - identifier: Key
        columnName: RegistryKey
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Defense Impairment, Persistence"
  sourceRule: "detections/defense_impairment/T1112_wdigest_credential_downgrade.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "Some legacy applications and older RDP/SSO configurations genuinely require WDigest, and an administrator may enable it deliberately."
  - "Disabling RunAsPPL is occasionally needed for compatibility with older EDR or debugging tools."
  - "Hardening rollbacks and troubleshooting can set these values legitimately."
  - "Configuration-management tooling that enforces a baseline will rewrite these values on every run, including to their secure state - which is why the direction of the change is evaluated rather than just the key."
knownBlindSpots:
  - "Setting the value via the registry API from inside an already-running process still produces EventID 13, but if Sysmon's registry filter excludes these paths there is no telemetry."
  - "An attacker who dumps LSASS without a downgrade still gets hashes, which are enough for pass-the-hash - so this rule is about password recovery, not about preventing credential theft."
  - "Does not detect the subsequent logon that actually populates the cleartext cache."
  - "The value can be set, used and reverted quickly; if the revert is all you see, the window may be missed."
  - "Group Policy can set WDigest without a local registry write event in some configurations."
