id: e5d06e65-2fdc-57da-90f4-c86d2fbadf09
name: "Scheduled task created or modified with a suspicious action"
description: |
    A scheduled task was registered or updated. Correlates the Security audit event for task registration with schtasks.exe command lines so the rule works whether or not task-scheduler auditing is enabled, and flags tasks whose action runs an interpreter or lives in a user-writable path.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1053
subTechniques:
  - T1053.005
query: |
    // T1053.005 - Scheduled Task
    let lookback = 3650d;
    let interpreter_markers = dynamic(["cmd.exe", "powershell", "pwsh", "cscript", "wscript",
                                       "mshta", "rundll32", "regsvr32", "%comspec%"]);
    let user_writable_paths = dynamic([@"\users\", @"\appdata\", @"\temp\", @"\programdata\",
                                       @"\public\", @"\windows\temp\"]);
    let task_events =
        union isfuzzy=false
          // Arm 1: the audit event. TaskContent carries the full task XML, including the action.
          ( SecurityScheduledTask()
            | where EventID in (4698, 4702)
            | project TimeGenerated, Computer, Account, Activity,
                      TaskName, Detail = TaskContent, DatasetId, Telemetry = "Security4698" ),
          // Arm 2: the command line, for hosts without task-scheduler auditing.
          ( SysmonProcessCreate()
            | where Process =~ "schtasks.exe"
                and tolower(CommandLine) has_any ("/create", "-create", "/change", "-change")
            | project TimeGenerated, Computer, Account, Activity = "SchtasksCommand",
                      TaskName = extract(@'(?i)/tn\s+"?([^"\s]+)', 1, CommandLine),
                      Detail = CommandLine, DatasetId, Telemetry = "Sysmon1" );
    task_events
    | where TimeGenerated > ago(lookback)
    | extend DetailLower = tolower(Detail)
    | extend ActionUsesInterpreter = DetailLower has_any (interpreter_markers),
             ActionInUserWritablePath = DetailLower has_any (user_writable_paths)
    | extend Indicators = strcat(iff(ActionUsesInterpreter, "interpreter ", ""),
                                 iff(ActionInUserWritablePath, "user-writable-path ", ""))
    | project TimeGenerated, Computer, Account, Activity, TaskName,
              Indicators, ActionUsesInterpreter, ActionInUserWritablePath,
              Detail = substring(Detail, 0, 400), Telemetry, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Execution, Persistence, Privilege Escalation"
  sourceRule: "detections/persistence/T1053.005_scheduled_task_creation.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "Windows itself registers and updates many scheduled tasks; software installers add more."
  - "Patch management, backup and monitoring agents create tasks that run interpreters legitimately."
  - "GPO-delivered scheduled tasks appear as task registrations on every host in scope."
  - "This rule does not threshold or allowlist task names, so on production telemetry it needs a baseline of expected task paths (for example anything under \\Microsoft\\Windows\\) before it is deployable."
knownBlindSpots:
  - "Tasks created through the Task Scheduler COM API directly (schtasks.exe never runs) are only caught by the 4698 arm."
  - "Registering a task on a REMOTE host via /s shows the task on the target but the command line on the source, so neither arm sees the whole action alone."
  - "4698 requires 'Audit Other Object Access Events', which is off by default."
  - "Dropping a task XML straight into C:\\Windows\\System32\\Tasks and creating the matching registry entry can bypass the scheduler service's audit event."
  - "TaskName extraction from the command line is regex-based and will be empty for unusual quoting."
