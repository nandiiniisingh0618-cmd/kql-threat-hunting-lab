id: 68c68ecc-53d1-59f2-b926-7f61749c6b49
name: "DCSync - directory replication rights used by a non-machine account"
description: |
    An account requested one of the Active Directory replication extended rights (DS-Replication-Get-Changes and friends) against the domain object. Domain controllers do this constantly between themselves, but a user account doing it is DCSync: pulling password hashes straight out of AD without touching NTDS.dit on disk.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003
subTechniques:
  - T1003.006
query: |
    // T1003.006 - DCSync
    let lookback = 3650d;
    // Extended-right GUIDs that together permit replicating secret attributes.
    let replication_rights = dynamic([
        "1131f6aa-9c07-11d1-f79f-00c04fc2dcd2",  // DS-Replication-Get-Changes
        "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2",  // DS-Replication-Get-Changes-All
        "89e95b76-444d-4c62-991a-0facbeda640c"   // DS-Replication-Get-Changes-In-Filtered-Set
    ]);
    let domain_dns_object_class = "19195a5b-6da0-11d0-afd3-00c04fd930c9";
    SecurityObjectAccess()
    | where TimeGenerated > ago(lookback)
    | where EventID == 4662
    | where ObjectType has domain_dns_object_class
    | where Properties has_any (replication_rights)
    // Domain controllers replicate with each other legitimately and authenticate as
    // computer accounts (DC01$). Excluding them is what turns this from noise into signal.
    // VERIFIED: dataset SDWIN-190403133337 contains MORDORDC$ doing exactly this.
    | where SubjectUserName !endswith "$"
    | extend RightsRequested = extract_all(@"\{([0-9a-fA-F-]{36})\}", Properties)
    | summarize
        Requests        = count(),
        DistinctRights  = dcount(tostring(RightsRequested)),
        FirstSeen       = min(TimeGenerated),
        LastSeen        = max(TimeGenerated)
        by Computer, Account, SubjectUserName, SubjectLogonId, DatasetId
    | project TimeGenerated = FirstSeen, Computer, Account, SubjectUserName,
              Requests, DistinctRights, LastSeen, DatasetId
    | order by Requests desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Credential Access"
  sourceRule: "detections/credential_access/T1003.006_dcsync_replication.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
  exported: 2026-11-15T16:50:36Z
falsePositives:
  - "Azure AD Connect / Entra Connect sync accounts hold replication rights by design and must be allowlisted by name."
  - "Some backup, migration and identity-governance products legitimately replicate directory changes."
  - "VERIFIED IN THIS CORPUS: dataset SDWIN-190403133337 shows MORDORDC$ (a DC computer account) requesting the same rights as normal DC-to-DC replication. The '$' filter is what removes it."
  - "A read-only domain controller's account also appears here if the '$' filter is removed."
knownBlindSpots:
  - "An attacker who grants replication rights to a computer account they control evades the '$' filter entirely."
  - "This fires on the rights being USED, not granted; the DACL modification that enabled it is a separate event (T1222.001 / T1098)."
  - "Only visible on the domain controller that served the request - if that DC's logs are not collected, nothing is seen."
  - "Replication against a specific user object rather than the domain root may use a different ObjectType and would be missed by the domainDNS class filter."
