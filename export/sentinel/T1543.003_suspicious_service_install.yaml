id: 21756492-d2bc-5348-b749-2b45b84c8f58
name: "Service installed with an interpreter, temp path or named-pipe image path"
description: |
    A Windows service was created whose image path runs a command interpreter, points into a user-writable directory, or writes to a named pipe. Service creation is a privileged persistence and lateral-movement primitive, and these image-path shapes are what remote-execution tooling such as PsExec and SMBExec leave behind.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1543
  - T1569
subTechniques:
  - T1543.003
  - T1569.002
query: |
    // T1543.003 - Windows Service  /  T1569.002 - Service Execution
    let lookback = 3650d;
    let interpreter_markers = dynamic(["cmd.exe", "%comspec%", "powershell", "pwsh",
                                       "cscript", "wscript", "rundll32", "regsvr32", "mshta"]);
    let user_writable_paths = dynamic([@"\users\", @"\appdata\", @"\temp\", @"\tmp\",
                                       @"\programdata\", @"\public\", @"\windows\temp\"]);
    let pipe_marker = @"\\.\pipe\";
    SecurityServiceInstall()
    | where TimeGenerated > ago(lookback)
    | where isnotempty(ServiceFileName)
    | extend ImagePathLower = tolower(ServiceFileName)
    | extend UsesInterpreter = ImagePathLower has_any (interpreter_markers),
             InUserWritablePath = ImagePathLower has_any (user_writable_paths),
             WritesToNamedPipe  = ImagePathLower has (pipe_marker)
    | where UsesInterpreter or InUserWritablePath or WritesToNamedPipe
    // svchost-hosted OS services are the dominant benign population and are shaped
    // differently (a -k group argument, always under system32).
    | where not(ImagePathLower startswith @"c:\windows\system32\svchost.exe -k")
    | extend Indicators = strcat(iff(UsesInterpreter, "interpreter ", ""),
                                 iff(InUserWritablePath, "user-writable-path ", ""),
                                 iff(WritesToNamedPipe, "named-pipe ", "")),
             RandomLookingName = ServiceName matches regex @"^[A-Za-z0-9]{8,24}$"
                 and ServiceName matches regex @"[A-Z]{4,}"
    | project TimeGenerated, Computer, Account, EventID, Channel, ServiceName,
              ServiceFileName, ServiceStartType, Indicators, RandomLookingName, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ServiceFileName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Execution, Persistence, Privilege Escalation"
  sourceRule: "detections/persistence/T1543.003_suspicious_service_install.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "Some legitimate products install services that shell out through cmd.exe wrappers."
  - "Development and build agents install services from user-writable paths."
  - "Driver and antimalware definition updates can create services under ProgramData (for example MpKslDrv under Windows Defender Definition Updates, present in this corpus)."
  - "Per-user svchost services (names ending in a random-looking suffix like _b0b5d) are an OS behaviour, which is why the svchost -k shape is excluded."
knownBlindSpots:
  - "A service pointing at a signed binary in a normal path - the quiet, patient approach - matches none of the three indicators."
  - "Service MODIFICATION (changing an existing service's binary) does not raise 4697/7045; it is a registry write under CurrentControlSet\\Services."
  - "Requires either 'Audit Security System Extension' (4697) or System-log collection (7045); many estates have neither."
  - "Driver services (type kernel) are matched only if their path is unusual."
  - "An attacker who installs the service remotely still shows it on the target host only."
