id: ac4bf92f-f32f-593a-8f3a-d5e1cfaf52c7
name: "NTDS.dit extraction via ntdsutil, shadow copy or direct copy"
description: |
    The Active Directory database NTDS.dit was copied or staged for extraction, using ntdsutil IFM, a volume shadow copy, or a direct file copy. NTDS.dit contains every domain account hash, so this is one of the highest-impact credential-access actions available on a domain controller.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003
subTechniques:
  - T1003.003
query: |
    // T1003.003 - NTDS
    let lookback = 3650d;
    // Each arm is a different tradecraft for the same objective.
    let ntdsutil_markers   = dynamic(["ac i ntds", "activate instance ntds", "ifm", "create full"]);
    let shadow_copy_tools  = dynamic(["vssadmin.exe", "diskshadow.exe", "wbadmin.exe"]);
    let process_events =
        union isfuzzy=false
          ( SysmonProcessCreate()
            | project TimeGenerated, Computer, Account, Process, CommandLine,
                      ParentProcess, DatasetId, Telemetry = "Sysmon1" ),
          ( SecurityProcessCreate()
            | project TimeGenerated, Computer, Account, Process, CommandLine,
                      ParentProcess, DatasetId, Telemetry = "Security4688" );
    process_events
    | where TimeGenerated > ago(lookback)
    | where isnotempty(CommandLine)
    | extend CommandLineLower = tolower(CommandLine)
    | where CommandLineLower has_any ("ntds", "vssadmin", "diskshadow", "wbadmin", "shadow")
    | extend Tradecraft = case(
          Process =~ "ntdsutil.exe" or CommandLineLower has_any (ntdsutil_markers), "NtdsutilIFM",
          Process in~ (shadow_copy_tools) and CommandLineLower has "shadow",            "ShadowCopy",
          CommandLineLower has "ntds.dit",                                              "DirectFileCopy",
          "Other")
    | where Tradecraft != "Other"
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcess,
              Tradecraft, Telemetry, DatasetId
    | order by TimeGenerated asc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: Process
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Credential Access"
  sourceRule: "detections/credential_access/T1003.003_ntds_extraction.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "Legitimate AD backup and disaster-recovery jobs use ntdsutil IFM and shadow copies on a schedule."
  - "Installing an additional domain controller via IFM media is a supported workflow."
  - "Backup agents (Veeam, DPM, Windows Server Backup) create shadow copies constantly - the ShadowCopy arm is the noisiest of the three."
  - "Shadow-copy creation alone is weak evidence; correlate with a later read of the NTDS path."
knownBlindSpots:
  - "DCSync replication steals the same hashes over the network and never touches NTDS.dit on disk - that is a separate detection (T1003.006)."
  - "Third-party or custom VSS clients that call the API directly produce no command line."
  - "An attacker renaming ntdsutil.exe still trips the command-line markers, but renaming AND obfuscating the arguments would evade this."
  - "Copying the file from an already-mounted shadow path with a generic tool (xcopy, robocopy) only matches if 'ntds.dit' appears literally."
