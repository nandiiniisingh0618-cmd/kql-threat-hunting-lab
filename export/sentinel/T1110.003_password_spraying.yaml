id: 3f4b35c4-be9f-5691-a95e-617f2f33a8cd
name: "Password spraying - failed logons across many distinct accounts"
description: |
    A single host saw failed logons for several distinct accounts inside a short window. Spraying one common password across many users keeps per-account failure counts below lockout thresholds, so the signal is the breadth of accounts rather than the depth of attempts against any one of them.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsForwardedEvents
    dataTypes:
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110
subTechniques:
  - T1110.003
query: |
    // T1110.003 - Password Spraying
    let lookback = 3650d;
    let spray_window = 30m;
    let min_distinct_accounts = 5;     // breadth, not depth, is the signal
    let failures =
        SecurityLogon()
        | where TimeGenerated > ago(lookback)
        | where EventID == 4625
        // Computer accounts failing is usually a trust or time-sync problem, not a spray.
        | where isnotempty(TargetUserName) and TargetUserName !endswith "$"
        | project TimeGenerated, Computer, TargetUserName, TargetAccount, LogonType,
                  LogonTypeName, IpAddress, WorkstationName, DatasetId;
    failures
    | summarize
        FailedLogons     = count(),
        DistinctAccounts = dcount(TargetUserName),
        Accounts         = make_set(TargetUserName, 20),
        LogonTypes       = make_set(LogonTypeName, 4),
        SourceIps        = make_set(IpAddress, 6),
        FirstSeen        = min(TimeGenerated),
        LastSeen         = max(TimeGenerated)
        by Computer, DatasetId, TimeBucket = bin(TimeGenerated, spray_window)
    | where DistinctAccounts >= min_distinct_accounts
    // Depth per account: a spray is wide and shallow. A value near 1 is characteristic.
    | extend AttemptsPerAccount = round(todouble(FailedLogons) / todouble(DistinctAccounts), 2),
             BurstSeconds       = datetime_diff('second', LastSeen, FirstSeen)
    | project TimeGenerated = FirstSeen, Computer, DistinctAccounts, FailedLogons,
              AttemptsPerAccount, BurstSeconds, Accounts, LogonTypes, SourceIps,
              LastSeen, DatasetId
    | order by DistinctAccounts desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIps
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
metadata:
  attackVersion: "20.1"
  attackTactics: "Credential Access"
  sourceRule: "detections/credential_access/T1110.003_password_spraying.yml"
  validation: >-
    UNTESTED IN A LIVE WORKSPACE. Generated by tools/export_sentinel.py
    from a rule validated only against the local Kusto emulator and the
    pinned public datasets. The query references this lab's normalization
    functions, which do NOT exist in a Sentinel workspace: see
    docs/schema-mapping.md for the table and parser each one maps to.
falsePositives:
  - "A service account whose password expired can generate many failures, but against ONE account - the AttemptsPerAccount column is what separates that from a spray."
  - "After a password change, cached credentials on phones, mapped drives and scheduled tasks produce bursts of failures."
  - "Misconfigured applications or load balancers retrying with stale credentials."
  - "Vulnerability scanners and authentication testing tools will trip this deliberately."
  - "On a domain controller all domain authentication failures aggregate to that host, so a DC's baseline is far higher than a workstation's."
knownBlindSpots:
  - "Password spraying against cloud identity (Entra ID) never touches a Windows Security log and needs sign-in logs instead."
  - "Slow sprays paced wider than the 30m window fall below the threshold - a deliberate evasion against exactly this rule shape."
  - "Spraying with a valid password that succeeds first time produces no 4625 at all."
  - "Kerberos pre-authentication failures surface as 4771, not 4625, and are not read here."
  - "bin() bucketing can split a spray across two buckets and halve the count."
  - "This corpus contains only 9 4625 events in total, so the rule is validated on a single thin dataset."
